<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Log Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    background: #111e15;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .modal {
    width: 100%;
    max-width: 420px;
    border-radius: 2.5rem;
    overflow: hidden;
    position: relative;
    background: #1E3A2B;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(245, 158, 11, 0.38) 0%, transparent 60%),
      radial-gradient(circle at 15% 20%, rgba(229, 214, 167, 0.18) 0%, transparent 40%),
      radial-gradient(circle at 85% 65%, rgba(201, 106, 58, 0.4) 0%, rgba(201, 106, 58, 0.15) 40%, transparent 55%),
      radial-gradient(circle at 20% 85%, rgba(245, 158, 11, 0.15) 0%, transparent 35%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    padding: 40px 32px 48px;
  }

  /* close button */
  .close-btn {
    position: absolute;
    top: 16px; right: 16px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: white;
    font-size: 18px;
  }

  /* header */
  .icon-wrap {
    width: 64px; height: 64px;
    border-radius: 1.5rem;
    background: rgba(201, 106, 58, 0.25);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    border: 1px solid rgba(201, 106, 58, 0.3);
  }
  .icon-wrap svg { width: 32px; height: 32px; color: #C96A3A; }

  .modal-title {
    font-size: 28px;
    font-weight: 600;
    color: white;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .modal-subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.55);
    text-align: center;
    margin-bottom: 36px;
  }

  /* form sections */
  .section { margin-bottom: 24px; }
  .label {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(229, 214, 167, 0.8);
    margin-bottom: 10px;
    display: block;
  }
  .label .opt {
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    font-size: 9px;
    color: rgba(255,255,255,0.35);
  }

  textarea, input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 1.25rem;
    padding: 16px;
    color: white;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea::placeholder, input::placeholder {
    color: rgba(255,255,255,0.28);
  }
  textarea:focus, input:focus {
    border-color: rgba(201,106,58,0.6);
  }
  textarea { height: 96px; }

  /* mood grid */
  .mood-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .mood-btn {
    padding: 12px 6px;
    border-radius: 1rem;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.65);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .mood-btn:hover { background: rgba(255,255,255,0.14); }
  .mood-btn.selected {
    background: #C96A3A;
    border-color: #C96A3A;
    color: white;
  }

  /* CTA */
  .cta {
    width: 100%;
    padding: 20px;
    border-radius: 2rem;
    background: #C96A3A;
    border: none;
    color: white;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
    box-shadow: 0 8px 24px rgba(201,106,58,0.35);
  }
  .cta:hover { opacity: 0.9; }

  /* label under modal */
  .caption {
    text-align: center;
    margin-top: 16px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div>
  <div class="modal">
    <button class="close-btn">✕</button>

    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </div>

    <div class="modal-title">Log a Meal</div>
    <div class="modal-subtitle">What did you eat, and what brought you to it?</div>

    <div class="section">
      <span class="label">What did you eat?</span>
      <textarea placeholder="Describe your meal..."></textarea>
    </div>

    <div class="section">
      <span class="label">How were you feeling before eating?</span>
      <div class="mood-grid">
        <button class="mood-btn">Hungry</button>
        <button class="mood-btn selected">Stressed</button>
        <button class="mood-btn">Bored</button>
        <button class="mood-btn">Social</button>
        <button class="mood-btn">Joy</button>
        <button class="mood-btn">Sad</button>
        <button class="mood-btn">Tired</button>
        <button class="mood-btn">Anxious</button>
      </div>
    </div>

    <div class="section">
      <span class="label">Any reflection? <span class="opt">(optional)</span></span>
      <input type="text" placeholder="What did you notice?" />
    </div>

    <button class="cta">Log Entry</button>
  </div>
  <div class="caption">Mockup — same modal background, white text + terracotta accents</div>
</div>

<script>
  document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
</script>
</body>
</html>
